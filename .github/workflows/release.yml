name: "Create release"

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: "Build release binary"
        run: cargo build --frozen --release

      - name: "Create release"
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: target/release/yg
          fail_on_unmatched_files: true
